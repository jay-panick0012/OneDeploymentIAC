name: Terraform Plan

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/environments.json"
      - ".github/tiers.json"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform Format Check (whole repo)
        run: terraform fmt -check -diff -recursive .

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync(".github/environments.json", "utf8"));
            const cells = [];
            for (const [environment, entry] of Object.entries(raw)) {
              if (environment.startsWith("$")) continue;
              const tier = entry.tier;
              for (const cloud of ["aws", "azure", "gcp"]) {
                for (const r of entry[cloud] || []) {
                  cells.push({
                    environment,
                    tier,
                    cloud,
                    region: r.region,
                    region_index: r.region_index,
                    path: `environments/${environment}/${cloud}/${r.region}`,
                  });
                }
              }
            }
            core.setOutput("matrix", JSON.stringify({ include: cells }));

  plan:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    # Gated by TIER, not instance name -- dev1/dev2/uat1/uat2/... all share
    # their tier's GitHub Environment, so a new instance never needs its own
    # secrets/reviewers provisioned. The dev tier has no protection rules;
    # every other tier's plan runs against a dedicated "<tier>-plan" GitHub
    # Environment (no required reviewers, ideally a read-only cloud
    # credential) so PR feedback isn't blocked on the same manual approval
    # that gates apply against the real "<tier>" environment.
    environment: ${{ matrix.tier == 'dev' && 'dev' || format('{0}-plan', matrix.tier) }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Azure login
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: GCP auth
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init --chdir="${{ github.workspace }}"
          tflint -f compact --chdir="${{ github.workspace }}/${{ matrix.path }}"

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.path }}
          soft_fail: true

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -input=false -var-file=terraform.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = `${{ matrix.path }}/plan.txt`;
            const plan = fs.existsSync(path)
              ? fs.readFileSync(path, "utf8").slice(0, 60000)
              : "(plan failed to produce output — see workflow run logs)";
            const marker = `<!-- tf-plan:${{ matrix.environment }}:${{ matrix.cloud }}:${{ matrix.region }} -->`;
            const status = "${{ steps.plan.outcome }}" === "success" ? "✅" : "❌";
            const body = `${marker}\n### ${status} Terraform Plan — ${{ matrix.environment }} / ${{ matrix.cloud }} / ${{ matrix.region }}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
