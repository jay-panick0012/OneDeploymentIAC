name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync(".github/region-matrix.json", "utf8"));
            const cells = [];
            for (const [environment, clouds] of Object.entries(raw)) {
              if (environment.startsWith("$")) continue;
              for (const [cloud, regions] of Object.entries(clouds)) {
                for (const r of regions) {
                  cells.push({
                    environment,
                    cloud,
                    region: r.region,
                    region_index: r.region_index,
                    path: `environments/${environment}/${cloud}/${r.region}`,
                  });
                }
              }
            }
            core.setOutput("matrix", JSON.stringify({ include: cells }));

  drift-check:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    # Read-only plan against the real environment's state. Reuses the same
    # "<env>-plan" read-only credential as PR plans for staging/production so
    # a nightly cron job is never the thing waiting on a human approval.
    environment: ${{ matrix.environment == 'dev' && 'dev' || format('{0}-plan', matrix.environment) }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    outputs: {}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Azure login
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: GCP auth
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Plan (detect drift)
        id: plan
        run: |
          set +e
          terraform plan -input=false -var-file=terraform.tfvars -detailed-exitcode -out=tfplan > plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync(`${{ matrix.path }}/plan.txt`, "utf8").slice(0, 60000);
            const title = `Drift detected: ${{ matrix.environment }} / ${{ matrix.cloud }} / ${{ matrix.region }}`;
            const marker = `<!-- drift:${{ matrix.environment }}:${{ matrix.cloud }}:${{ matrix.region }} -->`;
            const body = `${marker}\nNightly drift check found unapplied changes in \`${{ matrix.path }}\`.\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "terraform-drift",
            });
            const existing = issues.data.find((i) => i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["terraform-drift"],
              });
            }

      - name: Fail job if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
